{{/* Datanode deployment template. Accepts merged context with optional .group. */}}
{{- define "milvus.datanode.deployment" -}}
{{- $groupName := "" -}}
{{- if .group }}
{{- $groupName = required "dataNode.groups[].name is required" .group.name -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "milvus.datanode.fullname" . }}{{- if $groupName }}-{{ $groupName }}{{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "milvus.labels" . | indent 4 }}
    component: "datanode"
{{- with .group.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- if $groupName }}
    milvus.io/deployment-group: {{ $groupName | quote }}
{{- end }}

{{ include "milvus.ud.labels" . | indent 4 }}
  annotations:
{{ include "milvus.ud.annotations" . | indent 4 }}
{{- with .group.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}

spec:
  {{- $replicas := .Values.dataNode.replicas -}}
  {{- if and .group (hasKey .group "replicas") -}}
  {{- $replicas = .group.replicas -}}
  {{- end }}
  {{- if ge (int $replicas) 0 }}
  replicas: {{ $replicas }}
  {{- end }}
  {{- with .Values.dataNode.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
{{ include "milvus.matchLabels" . | indent 6 }}
      component: "datanode"
{{- if $groupName }}
      milvus.io/deployment-group: {{ $groupName | quote }}
{{- end }}
  template:
    metadata:
      labels:
{{ include "milvus.matchLabels" . | indent 8 }}
        component: "datanode"
{{- with .group.labels }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- if $groupName }}
        milvus.io/deployment-group: {{ $groupName | quote }}
{{- end }}
{{ include "milvus.ud.labels" . | indent 8 }}
      annotations:
      {{- if .Values.dataNode.profiling.enabled }}
        pyroscope.io/scrape: "true"
        pyroscope.io/application-name: {{ template "milvus.datanode.fullname" . }}
        pyroscope.io/port: "9091"
      {{- end }}
      {{- if .Values.dataNode.annotations }}
        {{- toYaml .Values.dataNode.annotations | nindent 8 }}
      {{- end }}
      {{- with .group.annotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{ include "milvus.ud.annotations" . | indent 8 }}
    spec:
      serviceAccountName: {{ include "milvus.serviceAccount" . }}
      {{- if .Values.image.all.pullSecrets }}
      imagePullSecrets:
      {{- range .Values.image.all.pullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      initContainers:
      {{- if .Values.dataNode.heaptrack.enabled }}
      - name: heaptrack
        command:
        - /bin/bash
        - -c
        - "cp -r /opt/heaptrack /milvus/tools"
        image: "{{ .Values.heaptrack.image.repository }}:{{ .Values.heaptrack.image.tag }}"
        imagePullPolicy: {{ .Values.heaptrack.image.pullPolicy }}
        {{ if and (.Values.containerSecurityContext) (not .Values.dataNode.containerSecurityContext) }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{ end }}
        {{ if .Values.dataNode.containerSecurityContext }}
        securityContext:
          {{- toYaml .Values.dataNode.containerSecurityContext | nindent 12 }}
        {{ end }}
        volumeMounts:
        - mountPath: /milvus/tools
          name: tools
      {{- end }}
      containers:
      - name: datanode
        image: "{{ .Values.image.all.repository }}:{{ .Values.image.all.tag }}"
        imagePullPolicy: {{ .Values.image.all.pullPolicy }}
        {{ if and (.Values.containerSecurityContext) (not .Values.dataNode.containerSecurityContext) }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{ end }}
        {{ if .Values.dataNode.containerSecurityContext }}
        securityContext:
          {{- toYaml .Values.dataNode.containerSecurityContext | nindent 12 }}
        {{ end }}
        {{- if .Values.dataNode.heaptrack.enabled }}
        args: [ "/milvus/tools/heaptrack/bin/heaptrack", "milvus", "run", "datanode" ]
        {{- else }}
        args: [ "milvus", "run", "datanode" ]
        {{- end }}
        env:
        {{- if .Values.dataNode.heaptrack.enabled }}
        - name: LD_LIBRARY_PATH
          value: /milvus/tools/heaptrack/lib:/milvus/lib:/usr/lib
        {{- end }}
        {{- if .Values.dataNode.extraEnv }}
          {{- toYaml .Values.dataNode.extraEnv | nindent 8 }}
        {{- end }}
        {{- if .group.extraEnv }}
          {{- toYaml .group.extraEnv | nindent 8 }}
        {{- end }}
        ports:
          - name: datanode
            containerPort: 21124
            protocol: TCP
          - name: metrics
            containerPort: 9091
            protocol: TCP
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.dataNode.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.customConfigMap }}
        - name: milvus-config
          mountPath: /milvus/configs/user.yaml
          subPath: milvus.yaml
          readOnly: true
        {{- else }}
        - name: milvus-config
          mountPath: /milvus/configs/default.yaml
          subPath: default.yaml
          readOnly: true
        - name: milvus-config
          mountPath: /milvus/configs/user.yaml
          subPath: user.yaml
          readOnly: true
        {{- end }}
        {{- if .Values.log.persistence.enabled }}
        - name: milvus-logs-disk
          mountPath: {{ .Values.log.persistence.mountPath | quote }}
          subPath: {{ .Values.log.persistence.persistentVolumeClaim.subPath | default "" }}
        {{- end }}
        - mountPath: /milvus/tools
          name: tools
        {{- if .Values.volumeMounts }}
          {{- toYaml .Values.volumeMounts | nindent 8 }}
        {{- end}}

    {{- $nodeSelector := .Values.dataNode.nodeSelector -}}
    {{- if and .group .group.nodeSelector -}}
    {{- $nodeSelector = .group.nodeSelector -}}
    {{- end }}
    {{- if and (.Values.nodeSelector) (not $nodeSelector) }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
    {{- end }}
    {{- if $nodeSelector }}
      nodeSelector:
{{ toYaml $nodeSelector | indent 8 }}
    {{- end }}
    {{- $affinity := .Values.dataNode.affinity -}}
    {{- if and .group .group.affinity -}}
    {{- $affinity = .group.affinity -}}
    {{- end }}
    {{- if and (.Values.affinity) (not $affinity) }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
    {{- end }}
    {{- if $affinity }}
      affinity:
{{ toYaml $affinity | indent 8 }}
    {{- end }}
    {{- $tolerations := .Values.dataNode.tolerations -}}
    {{- if and .group .group.tolerations -}}
    {{- $tolerations = .group.tolerations -}}
    {{- end }}
    {{- if and (.Values.tolerations) (not $tolerations) }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
    {{- end }}
    {{- if $tolerations }}
      tolerations:
{{ toYaml $tolerations | indent 8 }}
    {{- end }}
    {{- $topologySpreadConstraints := .Values.dataNode.topologySpreadConstraints -}}
    {{- if and .group .group.topologySpreadConstraints -}}
    {{- $topologySpreadConstraints = .group.topologySpreadConstraints -}}
    {{- end }}
    {{- if and (.Values.topologySpreadConstraints) (not $topologySpreadConstraints) }}
      topologySpreadConstraints:
{{ toYaml .Values.topologySpreadConstraints | indent 8 }}
    {{- end }}
    {{- if $topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml $topologySpreadConstraints | indent 8 }}
    {{- end }}
    {{- if and (.Values.securityContext) (not .Values.dataNode.securityContext) }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
    {{- end }}
    {{- if .Values.dataNode.securityContext }}
      securityContext:
{{ toYaml .Values.dataNode.securityContext | indent 8 }}
    {{- end }}
      volumes:
      - name: milvus-config
        configMap:
          {{- if .Values.customConfigMap }}
          name: {{ .Values.customConfigMap }}
          {{- else }}
          name: {{ template "milvus.fullname" . }}
          {{- end }}
      {{- if .Values.log.persistence.enabled }}
      - name: milvus-logs-disk
        persistentVolumeClaim:
          claimName: {{ .Values.log.persistence.persistentVolumeClaim.existingClaim | default (printf "%s-logs" (include "milvus.fullname" . | trunc 58)) }}
      {{- end }}
      - name: tools
        emptyDir: {}
      {{- if .Values.volumes }}
        {{- toYaml .Values.volumes | nindent 6 }}
      {{- end}}
{{- end -}}

{{- if and .Values.dataNode.enabled .Values.cluster.enabled }}
{{- if .Values.dataNode.groups }}
{{- range $group := .Values.dataNode.groups }}
---
{{ include "milvus.datanode.deployment" (merge (dict "group" $group) $) }}
{{- end }}
{{- else }}
{{ include "milvus.datanode.deployment" (merge (dict "group" (dict)) .) }}
{{- end }}
{{- end }}
